<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mymind — Open Source</title>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('mymind_theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1c1c1c;
      --text: #f5f5f5;
      --text-secondary: #888;
      --accent: #e8e4dc;
      --border: #222;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    :root[data-theme="light"] {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --surface-hover: #ececea;
      --text: #14140f;
      --text-secondary: #6b6b66;
      --accent: #14140f;
      --border: #e2e2de;
      --shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    :root[data-theme="light"] .btn-primary { color: #fff; }
    :root[data-theme="light"] .btn-primary:hover { background: #333; }
    :root[data-theme="light"] .card-action-btn { background: rgba(255,255,255,0.75); color: #14140f; }
    :root[data-theme="light"] .card-action-btn:hover { background: rgba(255,255,255,0.95); }
    :root[data-theme="light"] .detail-close { background: rgba(0,0,0,0.06); color: #14140f; }
    :root[data-theme="light"] .filter-tag.active { color: #fff; }
    :root[data-theme="light"] .type-option.active { background: rgba(20,20,15,0.06); }
    body, .card, .btn, .search-box, .modal, .toast, .detail-card, .filter-tag, .type-option, .card-action-btn {
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .header {
      position: fixed; top: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
    }
    .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--text-secondary); font-weight: 400; }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 8px 16px;
      color: var(--text);
      width: 280px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-box:focus { border-color: #444; background: var(--surface-hover); }
    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn:hover { background: var(--surface-hover); }
    .btn-primary { background: var(--accent); color: #000; border: none; font-weight: 600; }
    .btn-primary:hover { background: #fff; }
    .main { padding: 80px 24px 40px; max-width: 1400px; margin: 0 auto; }
    .masonry {
      column-count: 4;
      column-gap: 16px;
    }
    @media (max-width: 1200px) { .masonry { column-count: 3; } }
    @media (max-width: 900px) { .masonry { column-count: 2; } }
    @media (max-width: 600px) { .masonry { column-count: 1; } }
    .card {
      break-inside: avoid;
      margin-bottom: 16px;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: #333;
    }
    .card-image { width: 100%; display: block; object-fit: cover; }
    .card-content { padding: 14px 16px; }
    .card-title { font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      background: rgba(255,255,255,0.06);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--text-secondary);
    }
    .card-actions {
      position: absolute; top: 10px; right: 10px;
      display: flex; gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card:hover .card-actions { opacity: 1; }
    .card-action-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .card-action-btn:hover { background: rgba(0,0,0,0.8); }
    .card-note { padding: 20px; min-height: 120px; }
    .card-note .card-title { font-size: 16px; }
    .card-link { display: flex; align-items: center; padding: 14px 16px; gap: 12px; }
    .link-favicon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .link-info { flex: 1; min-width: 0; }
    .link-url {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty-state {
      text-align: center;
      padding: 100px 20px;
      color: var(--text-secondary);
    }
    .empty-state h2 { color: var(--text); margin-bottom: 12px; }
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      z-index: 2000;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      width: 100%; max-width: 520px;
      max-height: 90vh;
      overflow: hidden;
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h3 { font-size: 18px; }
    .modal-close {
      background: none; border: none; color: var(--text-secondary);
      font-size: 24px; cursor: pointer;
    }
    .modal-body { padding: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: #444; }
    .form-textarea { min-height: 100px; resize: vertical; }
    .meta-status {
      display: none;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      align-items: center;
      gap: 6px;
    }
    .meta-status.show { display: flex; }
    .meta-status.error { color: #b56; }
    .meta-spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--text-secondary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .form-actions {
      display: flex; gap: 10px; justify-content: flex-end;
      padding: 0 24px 24px;
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 3000;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .detail-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center;
      z-index: 2000;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .detail-overlay.active { display: flex; }
    .detail-card {
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--border);
      max-width: 700px;
      width: 100%;
      overflow: hidden;
      animation: modalIn 0.3s ease;
    }
    .detail-image { width: 100%; max-height: 400px; object-fit: cover; }
    .detail-content { padding: 28px; }
    .detail-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    .detail-desc { font-size: 16px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 20px; }
    .detail-meta {
      display: flex; gap: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .detail-close {
      position: absolute; top: 20px; right: 20px;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none; color: #fff;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .tag-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .filter-tag {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-tag:hover { border-color: #444; }
    .filter-tag.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }
    .type-selector { display: flex; gap: 8px; margin-bottom: 18px; }
    .type-option {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      transition: all 0.2s;
    }
    .type-option:hover { border-color: #444; }
    .type-option.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(232,228,220,0.08);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">mymind <span>— Open Source</span></div>
    <div class="header-actions">
      <input type="text" class="search-box" id="searchBox" placeholder="Search your mind...">
      <button class="btn" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark and light mode">🌙</button>
      <button class="btn btn-primary" onclick="openModal()">+ Add</button>
    </div>
  </div>
  
  <div class="main">
    <div class="tag-filter" id="tagFilter"></div>
    <div class="masonry" id="masonry"></div>
  </div>
  
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add to your mind</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="type-selector">
          <div class="type-option active" data-type="image" onclick="selectType('image')">Image</div>
          <div class="type-option" data-type="note" onclick="selectType('note')">Note</div>
          <div class="type-option" data-type="link" onclick="selectType('link')">Link</div>
        </div>
        <div class="form-group" id="urlGroup">
          <label class="form-label">Image URL</label>
          <input type="text" class="form-input" id="inputUrl" placeholder="https://...">
          <div id="metaStatus" class="meta-status"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" class="form-input" id="inputTitle" placeholder="Give it a name...">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="inputDesc" placeholder="What's on your mind?"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Tags (comma separated)</label>
          <input type="text" class="form-input" id="inputTags" placeholder="design, inspiration, ideas...">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="addCard()">Save</button>

      </div>
    </div>
  </div>
  
  <div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
    <button class="detail-close" onclick="closeDetail()">&times;</button>
    <div class="detail-card" id="detailCard"></div>
  </div>
  
  <div class="toast" id="toast"></div>
  <script>
    const THEME_KEY = 'mymind_theme';

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    }

    applyTheme(localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark');

    const STORAGE_KEY = 'mymind_cards';
    
    const defaultCards = [
      { id: 1, type: 'image', title: 'Minimalist Interior', desc: 'Clean lines and warm tones for a serene living space.', url: 'https://picsum.photos/seed/minimalist-interior/600/450', tags: ['interior', 'minimalism', 'inspiration'], date: 'Jul 24, 2026' },
      { id: 2, type: 'note', title: 'Design Principles', desc: '1. Less is more. 2. Form follows function. 3. Beauty in simplicity. 4. Every element must have a purpose. 5. White space is not empty space.', tags: ['design', 'notes'], date: 'Jul 23, 2026' },
      { id: 3, type: 'image', title: 'Ocean at Dawn', desc: 'The calm before the storm.', url: 'https://picsum.photos/seed/ocean-dawn/600/500', tags: ['nature', 'photography'], date: 'Jul 22, 2026' },
      { id: 4, type: 'link', title: 'Figma Community', desc: 'Best resource for UI kits and design systems.', url: 'https://figma.com/community', favicon: 'F', tags: ['tools', 'design'], date: 'Jul 21, 2026' },
      { id: 5, type: 'image', title: 'Abstract Shapes', desc: 'Color study for the new brand identity.', url: 'https://picsum.photos/seed/abstract-shapes/600/400', tags: ['art', 'color', 'brand'], date: 'Jul 20, 2026' },
      { id: 6, type: 'note', title: 'Meeting Notes', desc: 'Q3 roadmap discussion:\n- Launch new onboarding flow\n- Redesign dashboard\n- Mobile app v2.0\n- Performance optimization', tags: ['work', 'planning'], date: 'Jul 19, 2026' },
      { id: 7, type: 'image', title: 'Tokyo Streets', desc: 'Neon lights and urban energy.', url: 'https://picsum.photos/seed/tokyo-streets/600/550', tags: ['travel', 'japan', 'night'], date: 'Jul 18, 2026' },
      { id: 8, type: 'link', title: 'Dribbble', desc: 'Daily dose of creative work from top designers.', url: 'https://dribbble.com', favicon: 'D', tags: ['inspiration', 'design'], date: 'Jul 17, 2026' },
      { id: 9, type: 'image', title: 'Coffee Culture', desc: 'Morning ritual.', url: 'https://picsum.photos/seed/coffee-culture/600/400', tags: ['lifestyle', 'coffee'], date: 'Jul 16, 2026' },
      { id: 10, type: 'note', title: 'Book Quote', desc: '"The details are not the details. They make the design." — Charles Eames', tags: ['quotes', 'design'], date: 'Jul 15, 2026' },
      { id: 11, type: 'image', title: 'Mountain Peak', desc: 'Above the clouds.', url: 'https://picsum.photos/seed/mountain-peak/600/480', tags: ['nature', 'adventure'], date: 'Jul 14, 2026' },
      { id: 12, type: 'link', title: 'Notion Templates', desc: 'Productivity templates for creatives.', url: 'https://notion.so/templates', favicon: 'N', tags: ['productivity', 'tools'], date: 'Jul 13, 2026' }
    ];
    
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function loadCards() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return [...defaultCards];
      try {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : [...defaultCards];
      } catch {
        return [...defaultCards];
      }
    }
    
    function saveCards() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    }
    
    let cards = loadCards();
    let currentType = 'image';
    let activeTag = null;
    let searchQuery = '';
    let fetchedMeta = null;
    let metaFetchTimer = null;
    let metaFetchToken = 0;
    
    function renderCards() {
      const masonry = document.getElementById('masonry');
      let filtered = cards;
      
      if (activeTag) filtered = filtered.filter(c => c.tags.includes(activeTag));
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(c => 
          c.title.toLowerCase().includes(q) ||
          c.desc.toLowerCase().includes(q) ||
          c.tags.some(t => t.toLowerCase().includes(q))
        );
      }
      
      if (filtered.length === 0) {
        masonry.innerHTML = `<div class="empty-state" style="column-span: all;"><h2>Nothing here yet</h2><p>Start adding things to your mind.</p></div>`;
        return;
      }
      
      masonry.innerHTML = filtered.map(card => {
        if (card.type === 'image') {
          return `<div class="card" onclick="openDetail(${card.id})">
            <div class="card-actions"><button class="card-action-btn" onclick="event.stopPropagation(); deleteCard(${card.id})">🗑</button></div>
            <img class="card-image" src="${escapeHtml(card.url)}" alt="${escapeHtml(card.title)}" loading="lazy">
            <div class="card-content"><div class="card-title">${escapeHtml(card.title)}</div><div class="card-desc">${escapeHtml(card.desc)}</div><div class="card-tags">${card.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div></div>
          </div>`;
        } else if (card.type === 'note') {
          return `<div class="card card-note" onclick="openDetail(${card.id})">
            <div class="card-actions"><button class="card-action-btn" onclick="event.stopPropagation(); deleteCard(${card.id})">🗑</button></div>
            <div class="card-title">${escapeHtml(card.title)}</div><div class="card-desc">${escapeHtml(card.desc).replace(/\n/g, '<br>')}</div><div class="card-tags">${card.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
          </div>`;
        } else if (card.type === 'link') {
          const logoHtml = card.logo
            ? `<img src="${escapeHtml(card.logo)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px;" onerror="this.parentElement.textContent='${(card.favicon || '🔗').replace(/'/g, "\\'")}'">`
            : escapeHtml(card.favicon || '🔗');
          const heroImg = card.image
            ? `<img class="card-image" src="${escapeHtml(card.image)}" alt="${escapeHtml(card.title)}" loading="lazy">`
            : '';
          return `<div class="card" onclick="openDetail(${card.id})">
            <div class="card-actions"><button class="card-action-btn" onclick="event.stopPropagation(); deleteCard(${card.id})">🗑</button></div>
            ${heroImg}
            <div class="card-link"><div class="link-favicon">${logoHtml}</div><div class="link-info"><div class="card-title">${escapeHtml(card.title)}</div><div class="link-url">${escapeHtml(card.url)}</div></div></div>
            <div class="card-content" style="padding-top: 0;"><div class="card-desc">${escapeHtml(card.desc)}</div><div class="card-tags">${card.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div></div>
          </div>`;
        }
      }).join('');
    }
    
    function renderTags() {
      const allTags = [...new Set(cards.flatMap(c => c.tags))].sort();
      const filter = document.getElementById('tagFilter');
      filter.innerHTML = `<div class="filter-tag ${!activeTag ? 'active' : ''}" onclick="setTag(null)">All</div>` +
        allTags.map(t => `<div class="filter-tag ${activeTag === t ? 'active' : ''}" onclick="setTag('${escapeHtml(t).replace(/'/g, "\\'")}')">${escapeHtml(t)}</div>`).join('');
    }
    
    function setTag(tag) { activeTag = tag; renderTags(); renderCards(); }
    
    document.getElementById('searchBox').addEventListener('input', (e) => { searchQuery = e.target.value; renderCards(); });
    
    function openModal() { document.getElementById('modal').classList.add('active'); document.getElementById('inputTitle').focus(); }
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputUrl').value = '';
      document.getElementById('inputDesc').value = '';
      document.getElementById('inputTags').value = '';
      clearTimeout(metaFetchTimer);
      metaFetchToken++;
      fetchedMeta = null;
      hideMetaStatus();
    }
    
    function selectType(type) {
      currentType = type;
      document.querySelectorAll('.type-option').forEach(el => el.classList.toggle('active', el.dataset.type === type));
      const urlGroup = document.getElementById('urlGroup');
      const urlLabel = urlGroup.querySelector('.form-label');
      const urlInput = document.getElementById('inputUrl');
      if (type === 'image') { urlGroup.style.display = 'block'; urlLabel.textContent = 'Image URL'; urlInput.placeholder = 'https://...'; hideMetaStatus(); }
      else if (type === 'link') {
        urlGroup.style.display = 'block'; urlLabel.textContent = 'URL'; urlInput.placeholder = 'https://example.com';
        if (urlInput.value.trim()) fetchLinkMetadata();
      }
      else { urlGroup.style.display = 'none'; hideMetaStatus(); }
    }
    
    function normalizeUrl(raw) {
      if (!raw) return raw;
      return /^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : 'https://' + raw;
    }
    
    function setMetaStatus(text, opts) {
      const el = document.getElementById('metaStatus');
      opts = opts || {};
      el.innerHTML = opts.spinner ? `<span class="meta-spinner"></span><span>${escapeHtml(text)}</span>` : escapeHtml(text);
      el.classList.add('show');
      el.classList.toggle('error', !!opts.error);
    }
    
    function hideMetaStatus() {
      const el = document.getElementById('metaStatus');
      el.classList.remove('show', 'error');
      el.innerHTML = '';
    }
    
    async function fetchLinkMetadata() {
      const urlInput = document.getElementById('inputUrl');
      const raw = urlInput.value.trim();
      if (!raw || currentType !== 'link') return;
      const url = normalizeUrl(raw);
      const token = ++metaFetchToken;
      setMetaStatus('Fetching preview…', { spinner: true });
      try {
        const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
        const json = await res.json();
        if (token !== metaFetchToken) return; // a newer request superseded this one
        if (json.status === 'success' && json.data) {
          const d = json.data;
          fetchedMeta = {
            image: (d.image && d.image.url) || '',
            logo: (d.logo && d.logo.url) || '',
            siteName: d.publisher || (d.author || '') || ''
          };
          const titleInput = document.getElementById('inputTitle');
          const descInput = document.getElementById('inputDesc');
          if (!titleInput.value.trim() && d.title) titleInput.value = d.title;
          if (!descInput.value.trim() && d.description) descInput.value = d.description;
          urlInput.value = url;
          setMetaStatus('✓ Preview loaded');
          setTimeout(() => { if (token === metaFetchToken) hideMetaStatus(); }, 1800);
        } else {
          fetchedMeta = null;
          setMetaStatus("Couldn't fetch a preview — fill this in manually", { error: true });
        }
      } catch (e) {
        if (token !== metaFetchToken) return;
        fetchedMeta = null;
        setMetaStatus("Couldn't fetch a preview — fill this in manually", { error: true });
      }
    }
    
    document.getElementById('inputUrl').addEventListener('input', () => {
      if (currentType !== 'link') return;
      fetchedMeta = null;
      clearTimeout(metaFetchTimer);
      metaFetchTimer = setTimeout(fetchLinkMetadata, 700);
    });
    
    function addCard() {
      const title = document.getElementById('inputTitle').value.trim();
      const desc = document.getElementById('inputDesc').value.trim();
      let url = document.getElementById('inputUrl').value.trim();
      const tagsStr = document.getElementById('inputTags').value.trim();
      
      if (!title) { showToast('Please enter a title'); return; }
      
      if (currentType === 'link' && url) url = normalizeUrl(url);
      
      const newCard = {
        id: Date.now(),
        type: currentType,
        title,
        desc: desc || '',
        tags: tagsStr ? tagsStr.split(',').map(t => t.trim().toLowerCase()).filter(Boolean) : [],
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      };
      
      if (currentType === 'image' || currentType === 'link') {
        newCard.url = url || (currentType === 'image' ? 'https://placehold.co/600x400?text=No+Image' : '#');
      }
      if (currentType === 'link') {
        try { newCard.favicon = new URL(url).hostname[0].toUpperCase(); } catch { newCard.favicon = '🔗'; }
        if (fetchedMeta) {
          if (fetchedMeta.image) newCard.image = fetchedMeta.image;
          if (fetchedMeta.logo) newCard.logo = fetchedMeta.logo;
          if (fetchedMeta.siteName) newCard.siteName = fetchedMeta.siteName;
        }
      }
      
      cards.unshift(newCard);
      saveCards();
      renderCards();
      renderTags();
      closeModal();
      showToast('Added to your mind');
    }
    
    function deleteCard(id) {
      if (confirm('Remove from your mind?')) {
        cards = cards.filter(c => c.id !== id);
        saveCards();
        renderCards();
        renderTags();
        showToast('Removed');
      }
    }
    
    function openDetail(id) {
      const card = cards.find(c => c.id === id);
      if (!card) return;
      const overlay = document.getElementById('detailOverlay');
      const detailCard = document.getElementById('detailCard');
      let html = '';
      if (card.type === 'image' && card.url) html += `<img class="detail-image" src="${escapeHtml(card.url)}" alt="${escapeHtml(card.title)}">`;
      if (card.type === 'link' && card.image) html += `<img class="detail-image" src="${escapeHtml(card.image)}" alt="${escapeHtml(card.title)}">`;
      html += `<div class="detail-content"><div class="detail-title">${escapeHtml(card.title)}</div><div class="detail-desc">${escapeHtml(card.desc).replace(/\n/g, '<br>')}</div>`;
      if (card.type === 'link' && card.url) {
        const siteLabel = card.siteName ? `${escapeHtml(card.siteName)} — ` : '';
        html += `<div style="margin-bottom: 16px;"><a href="${escapeHtml(card.url)}" target="_blank" rel="noopener" style="color: #888; font-size: 14px; text-decoration: none; border-bottom: 1px solid #333; padding-bottom: 2px;">${siteLabel}${escapeHtml(card.url)} →</a></div>`;
      }
      html += `<div class="card-tags" style="margin-bottom: 20px;">${card.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>`;
      html += `<div class="detail-meta"><span>📅 ${escapeHtml(card.date)}</span><span>🏷️ ${escapeHtml(card.type)}</span></div></div>`;
      detailCard.innerHTML = html;
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    
    function closeDetail(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('detailOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }
    
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeModal(); closeDetail(); }
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('searchBox').focus(); }
      if ((e.metaKey || e.ctrlKey) && e.key === 'n') { e.preventDefault(); openModal(); }
    });
    
    renderTags();
    renderCards();
  </script>
</body>
</html>
