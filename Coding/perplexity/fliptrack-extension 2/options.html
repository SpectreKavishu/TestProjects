<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FlipTrack Pro - Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #6750a4; margin-bottom: 24px; }
    .setting {
      margin-bottom: 20px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      padding: 12px 24px;
      background: #6750a4;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #5a4080; }
  </style>
</head>
<body>
  <h1>⚙️ FlipTrack Pro Settings</h1>

  <div class="setting">
    <label><input type="checkbox" id="emailAlerts" checked> Email Alerts</label>
  </div>

  <div class="setting">
    <label for="checkInterval">Price Check Interval (minutes)</label>
    <input type="number" id="checkInterval" min="5" max="1440" value="30">
  </div>

  <div class="setting">
    <label for="alertThreshold">Default Alert Threshold (%)</label>
    <input type="number" id="alertThreshold" min="1" max="100" value="10">
  </div>

  <button id="saveSettings">Save Settings</button>

  <script>
    document.getElementById('saveSettings').addEventListener('click', () => {
      const settings = {
        emailAlerts: document.getElementById('emailAlerts').checked,
        checkInterval: parseInt(document.getElementById('checkInterval').value),
        alertThreshold: parseInt(document.getElementById('alertThreshold').value)
      };
      chrome.storage.local.set({ userSettings: settings }, () => {
        alert('Settings saved!');
      });
    });

    chrome.storage.local.get('userSettings', (data) => {
      if (data.userSettings) {
        document.getElementById('emailAlerts').checked = data.userSettings.emailAlerts;
        document.getElementById('checkInterval').value = data.userSettings.checkInterval;
      }
    });
  </script>
</body>
</html>
